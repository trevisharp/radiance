name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Check tag matches package version
        run: |
          version=$(dotnet msbuild Radiance/Radiance.csproj -getProperty:PackageVersion)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match PackageVersion $version"
            exit 1
          fi

      - name: Pack
        run: dotnet pack Radiance/Radiance.csproj -c Release -o artifacts

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: trevisharp

      - name: Push
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
